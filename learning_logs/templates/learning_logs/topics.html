{% extends "learning_logs/base.html" %}

{% block header %}
  <h3>Onderwerpen</h3>
{% endblock header %}

{% block content %}

  <ul>
    {% for topic in topics %}
      <li>
        <h4>
          <a href="{% url 'learning_logs:topic' topic.id %}">{{ topic }}</a>
        </h4>
      </li>
    {% empty %}
      <li>Nog geen onderwerp toegevoegd.</li>
    {% endfor %}
  </ul>

  <h5><a href="{% url 'learning_logs:new_topic' %}">Voeg een nieuw onderwerp toe:</a></h5>

{% endblock content %}
